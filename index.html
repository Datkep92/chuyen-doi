<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chuyển PDF sang Word & Excel</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --accent:#3b82f6; --text:#e2e8f0; --muted:#94a3b8; --ok:#22c55e; --err:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .wrap { max-width:900px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:24px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .card { background:var(--card); border-radius:14px; padding:20px; margin-bottom:16px; box-shadow:0 4px 20px rgba(0,0,0,.3); }
  .drop { border:2px dashed #475569; border-radius:12px; padding:40px 20px; text-align:center; cursor:pointer; transition:.2s; }
  .drop:hover, .drop.over { border-color:var(--accent); background:rgba(59,130,246,.08); }
  .drop input { display:none; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:10px 18px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; transition:.15s; }
  .btn:hover { filter:brightness(1.1); }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  .btn.secondary { background:#334155; }
  .btn.success { background:var(--ok); }
  .row { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .progress { height:8px; background:#334155; border-radius:4px; overflow:hidden; margin-top:12px; }
  .progress > div { height:100%; background:var(--accent); width:0%; transition:width .2s; }
  .log { font-family:monospace; font-size:12px; color:var(--muted); max-height:160px; overflow:auto; background:#0b1220; padding:10px; border-radius:8px; margin-top:10px; white-space:pre-wrap; }
  .preview { max-height:520px; overflow:auto; background:#0b1220; padding:12px; border-radius:8px; font-size:13px; line-height:1.5; }
  .preview table { border-collapse:collapse; width:max-content; min-width:100%; margin:8px 0; }
  .preview td, .preview th { border:1px solid #334155; padding:4px 6px; white-space:nowrap; vertical-align:top; }
  .preview .docx-wrapper { background:#fff; color:#000; padding:16px; border-radius:8px; }
  .pill { display:inline-block; background:#334155; padding:2px 8px; border-radius:999px; font-size:12px; margin-right:6px; }
  .err { color:var(--err); }
  .ok { color:var(--ok); }
  footer { color:var(--muted); font-size:12px; text-align:center; margin-top:24px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📄 Chuyển PDF / Ảnh → Word / Excel</h1>
  <p class="sub">Chạy hoàn toàn trên trình duyệt, không server xử lý. Giữ số liệu và bố cục tối đa có thể. Hỗ trợ PDF có text, PDF scan ảnh và ảnh chụp.</p>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="application/pdf,.pdf,image/*">
      <div id="dropText">Kéo thả file PDF/ảnh vào đây, hoặc bấm để chọn</div>
      <div style="margin-top:8px;color:var(--muted);font-size:13px">Hỗ trợ PDF text, PDF scan ảnh (OCR tự động) và ảnh PNG/JPG</div>
    </label>
    <div class="row">
      <button class="btn" id="btnPick">📂 Chọn file</button>
      <button class="btn" id="btnAnalyze" disabled>🔍 Phân tích</button>
      <button class="btn secondary" id="btnReset">↺ Làm lại</button>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <div class="log" id="log"></div>
  </div>

  <div class="card" id="infoCard" style="display:none">
    <div id="info"></div>
    <div class="row">
      <button class="btn success" id="btnWord">⬇ Xuất Word (.docx)</button>
      <button class="btn success" id="btnExcel">⬇ Xuất Excel (.xlsx)</button>
      <button class="btn secondary" id="btnJson">⬇ Xuất JSON (kiểm tra)</button>
    </div>
  </div>

  <div class="card" id="previewCard" style="display:none">
    <h3 style="margin:0 0 8px">Xem trước</h3>
    <div class="row" style="margin-bottom:8px">
      <button class="btn secondary" id="btnPreviewData">Dữ liệu</button>
      <button class="btn secondary" id="btnPreviewWord">Word</button>
      <button class="btn secondary" id="btnPreviewExcel">Excel</button>
    </div>
    <div class="preview" id="preview"></div>
  </div>

  <footer>Powered by pdf.js · SheetJS · docx.js · Tesseract.js — chạy local, dữ liệu không rời máy.</footer>
</div>

<!-- Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(msg, cls){ const d=document.createElement('div'); if(cls)d.className=cls; d.textContent=msg; logEl.appendChild(d); logEl.scrollTop=logEl.scrollHeight; }
function setProgress(p){ $('bar').style.width = p+'%'; }
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null;
let imageFile = null;
let fileType = 'pdf'; // 'pdf' | 'image'
let pagesData = []; // normalized page records
let ocrEngine = null;

const drop = $('drop');
const fileInput = $('file');
drop.addEventListener('click', ()=>fileInput.click());
drop.addEventListener('dragover', e=>{e.preventDefault(); drop.classList.add('over');});
drop.addEventListener('dragleave', ()=>drop.classList.remove('over'));
drop.addEventListener('drop', e=>{e.preventDefault(); drop.classList.remove('over'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);});
fileInput.addEventListener('change', e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); });
$('btnPick').addEventListener('click', ()=>fileInput.click());
$('btnReset').addEventListener('click', ()=>location.reload());

function isPdfFile(f){
  return f.type==='application/pdf' || /\.pdf$/i.test(f.name||'');
}
function isImageFile(f){
  return /^image\//i.test(f.type||'') || /\.(png|jpe?g|webp|bmp|gif)$/i.test(f.name||'');
}

function handleFile(f){
  if(!f){ log('Không có file.', 'err'); return; }
  if(!isPdfFile(f) && !isImageFile(f)){ log('Chỉ chấp nhận PDF hoặc ảnh. (type=' + (f.type||'') + ')', 'err'); return; }
  $('dropText').textContent = f.name + ' (' + (f.size/1024/1024).toFixed(2) + ' MB)';
  if(isPdfFile(f)){
    fileType = 'pdf';
    pdfDoc = null; imageFile = null;
    const r = new FileReader();
    r.onerror = () => log('Lỗi đọc file: ' + (r.error && r.error.message), 'err');
    r.onload = async e => {
      try {
        const data = new Uint8Array(e.target.result);
        pdfDoc = await pdfjsLib.getDocument({data}).promise;
        log('Đã mở PDF: ' + pdfDoc.numPages + ' trang.', 'ok');
        $('btnAnalyze').disabled = false;
      } catch(err){ log('Lỗi mở PDF: ' + err.message, 'err'); }
    };
    r.readAsArrayBuffer(f);
  } else {
    fileType = 'image';
    imageFile = f;
    pdfDoc = null;
    log('Đã chọn ảnh: ' + f.name, 'ok');
    $('btnAnalyze').disabled = false;
  }
}

async function getOcrEngine(){
  if(ocrEngine) return ocrEngine;
  log('Đang tải engine OCR Tesseract.js (lần đầu có thể lâu)...');
  if(typeof Tesseract === 'undefined'){
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  ocrEngine = await Tesseract.createWorker('vie', 1, { logger: () => {} });
  log('Engine OCR đã sẵn sàng.', 'ok');
  return ocrEngine;
}

function mapOcrResult(result){
  const words = (result && result.data && Array.isArray(result.data.words)) ? result.data.words : [];
  const out = [];
  for(const w of words){
    if(!w || !w.text || !w.text.trim()) continue;
    const b = w.bbox || {};
    const x = (typeof b.x0 === 'number') ? b.x0 : 0;
    const y = (typeof b.y0 === 'number') ? b.y0 : 0;
    const x1 = (typeof b.x1 === 'number') ? b.x1 : x + 10;
    const y1 = (typeof b.y1 === 'number') ? b.y1 : y + 12;
    out.push({ text: w.text.trim(), x, y, w: Math.max(1, x1-x), h: Math.max(1, y1-y) });
  }
  if(!out.length){
    const lines = (result && result.data && Array.isArray(result.data.lines)) ? result.data.lines : [];
    for(const ln of lines){
      if(!ln || !ln.text || !ln.text.trim()) continue;
      const b = ln.bbox || {};
      const x = (typeof b.x0 === 'number') ? b.x0 : 0;
      const y = (typeof b.y0 === 'number') ? b.y0 : 0;
      const x1 = (typeof b.x1 === 'number') ? b.x1 : x + 10;
      const y1 = (typeof b.y1 === 'number') ? b.y1 : y + 12;
      out.push({ text: ln.text.trim(), x, y, w: Math.max(1, x1-x), h: Math.max(1, y1-y) });
    }
  }
  return out;
}

async function extractPdfPage(page, pageNum){
  const scale = 3;
  const viewport = page.getViewport({scale});
  // 1) Try embedded text
  const tc = await page.getTextContent();
  const items = [];
  for(const it of tc.items){
    if(!it.str || !it.str.trim()) continue;
    const tx = pdfjsLib.Util.transform(viewport.transform, it.transform);
    items.push({ text: it.str, x: tx[4], y: tx[5], w: (it.width||1)*viewport.scale, h: ((it.height||10))*viewport.scale });
  }
  const textLen = items.reduce((a,i)=>a+i.text.length,0);
  if(textLen >= 30){
    log('Trang ' + pageNum + ': text nhúng (' + items.length + ' đoạn).');
    return { items, sourceType:'pdf-text', width: viewport.width, height: viewport.height };
  }
  // 2) Fallback OCR for scanned pages
  log('Trang ' + pageNum + ': ít text, dùng OCR...');
  try {
    const ocr = await getOcrEngine();
    const canvas = document.createElement('canvas');
    canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({canvasContext: ctx, viewport}).promise;
    const result = await ocr.recognize(canvas);
    const ocrItems = mapOcrResult(result);
    log('Trang ' + pageNum + ': OCR (' + ocrItems.length + ' dòng).');
    return { items: ocrItems, sourceType:'pdf-scan', width: viewport.width, height: viewport.height };
  } catch(err){
    log('Trang ' + pageNum + ': OCR lỗi - ' + err.message, 'err');
    console.error(err);
    return { items, sourceType:'pdf-scan', width: viewport.width, height: viewport.height };
  }
}

async function extractImageItems(file){
  const url = URL.createObjectURL(file);
  const img = await new Promise((resolve, reject)=>{
    const i = new Image();
    i.onload = ()=>resolve(i);
    i.onerror = reject;
    i.src = url;
  });
  const canvas = document.createElement('canvas');
  canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  URL.revokeObjectURL(url);
  const ocr = await getOcrEngine();
  const result = await ocr.recognize(canvas);
  const items = mapOcrResult(result);
  log('Ảnh: OCR (' + items.length + ' dòng).');
  return { items, sourceType:'image', width: canvas.width, height: canvas.height };
}

function processPage(pageNum, items, width, height, sourceType){
  if(!items || !items.length){ log('Trang ' + pageNum + ' không có text.', 'err'); return; }
  const sorted = items.slice().sort((a,b)=> a.y===b.y ? a.x-b.x : a.y-b.y);

  const heights = sorted.map(i=>i.h).filter(h=>h>0).sort((a,b)=>a-b);
  const medH = heights.length ? heights[Math.floor(heights.length/2)] : 12;
  const ROW_TOL = Math.max(6, Math.min(20, medH*0.65));

  // Group into lines by Y
  const lines = [];
  for(const it of sorted){
    const last = lines[lines.length-1];
    if(last && Math.abs(last.y - it.y) <= ROW_TOL){
      last.items.push(it);
      last.y = (last.y + it.y)/2;
    } else {
      lines.push({ y: it.y, items: [it] });
    }
  }
  for(const ln of lines) ln.items.sort((a,b)=>a.x-b.x);

  // Split each line into cells by large horizontal gaps
  const GAP_SPLIT = Math.max(12, Math.min(24, medH*0.9));
  const lineCells = lines.map(ln => {
    const cells = [];
    let cur = [ln.items[0]];
    for(let i=1;i<ln.items.length;i++){
      const prev = ln.items[i-1];
      const gap = ln.items[i].x - (prev.x + (prev.w||0));
      if(gap > GAP_SPLIT){
        cells.push(cur); cur = [ln.items[i]];
      } else {
        cur.push(ln.items[i]);
      }
    }
    if(cur.length) cells.push(cur);
    return { y: ln.y, cells: cells.map(c => ({ x: c[0].x, text: c.map(i=>i.text).join(' ').trim() })) };
  }).filter(lc => lc.cells.some(c=>c.text.trim()));

  // Cluster column boundaries across all lines
  const COL_TOL = Math.max(12, Math.min(24, medH*1.1));
  const boundaries = [];
  for(const lc of lineCells) for(const c of lc.cells) boundaries.push(c.x);
  boundaries.sort((a,b)=>a-b);
  const colCenters = [];
  for(const x of boundaries){
    if(!colCenters.length || x - colCenters[colCenters.length-1] > COL_TOL){
      colCenters.push(x);
    } else {
      colCenters[colCenters.length-1] = (colCenters[colCenters.length-1]+x)/2;
    }
  }

  // Build grid
  const grid = lineCells.map(lc => {
    const row = colCenters.map(()=>'');
    for(const c of lc.cells){
      let ci = 0, best = Infinity;
      for(let k=0;k<colCenters.length;k++){
        const d = Math.abs(colCenters[k]-c.x);
        if(d < best){ best=d; ci=k; }
      }
      row[ci] = row[ci] ? row[ci] + ' ' + c.text : c.text;
    }
    return row;
  });

  // Trim empty trailing rows
  while(grid.length && grid[grid.length-1].every(c=>!String(c).trim())) grid.pop();
  // Trim empty trailing columns
  let maxCol = 0;
  for(const r of grid) for(let c=0;c<r.length;c++) if(String(r[c]).trim()) maxCol=Math.max(maxCol,c);
  const trimmed = grid.map(r=>r.slice(0,maxCol+1));

  // Detect number format (per document text)
  const allText = items.map(i=>i.text).join(' ');
  let numFormat = 'auto';
  if(/\d\.\d{3},\d/.test(allText)) numFormat = 'eu';
  else if(/\d,\d{3}\.\d/.test(allText)) numFormat = 'us';

  function parseNumber(str){
    const t = str.trim();
    if(t==='') return '';
    const noSpace = t.replace(/\s/g,'');
    let s = noSpace;
    // preserve leading-zero codes (e.g. 0002, 00221556)
    if(/^0\d/.test(s) && s!=='0') return t;
    const hasComma = s.includes(',');
    const hasDot = s.includes('.');
    if(numFormat === 'eu'){
      if(hasComma){ s = s.replace(/\./g,'').replace(',','.'); }
      else if(hasDot && /^\d{1,3}(\.\d{3})+$/.test(s)){ s = s.replace(/\./g,''); }
    } else if(numFormat === 'us'){
      if(hasComma){ s = s.replace(/,/g,''); }
    } else {
      if(hasComma && hasDot){
        if(s.lastIndexOf(',') > s.lastIndexOf('.')){ s = s.replace(/\./g,'').replace(',','.'); }
        else { s = s.replace(/,/g,''); }
      } else if(hasComma && !hasDot){
        if(/^\d{1,3}(,\d{3})+$/.test(s)){ s = s.replace(/,/g,''); }
        else { s = s.replace(',','.'); }
      } else if(hasDot && !hasComma){
        if(/^\d{1,3}(\.\d{3})+$/.test(s)){ s = s.replace(/\./g,''); }
      }
    }
    if(/^[-+]?\d*\.?\d+(?:[eE][-+]?\d+)?$/.test(s) && s!=='' && s!=='.' && s!=='-' && s!=='+' ){
      const n = Number(s);
      if(isFinite(n)) return n;
    }
    return t;
  }

  const typed = trimmed.map(r=>r.map(v=> parseNumber(String(v))));
  const record = {
    pageNum,
    width, height,
    sourceType,
    numFormat,
    itemsCount: items.length,
    lines: lineCells.map(lc=>({ y: lc.y, cells: lc.cells.map(c=>({ x: c.x, text: c.text })) })),
    columns: colCenters,
    grid: typed,
    rows: typed.length,
    cols: (typed[0]?.length||0)
  };
  pagesData.push(record);
  log('Trang ' + pageNum + ': ' + typed.length + ' dòng, ' + (typed[0]?.length||0) + ' cột. [' + sourceType + ']');
}

async function analyze(){
  pagesData = [];
  setProgress(0);
  log('Bắt đầu phân tích...');
  if(fileType === 'pdf'){
    if(!pdfDoc){ log('Chưa có PDF.', 'err'); return; }
    for(let p=1; p<=pdfDoc.numPages; p++){
      const page = await pdfDoc.getPage(p);
      setProgress(Math.round((p-1)/pdfDoc.numPages*100));
      log('Trang ' + p + ': đang trích xuất...');
      const res = await extractPdfPage(page, p);
      if(!res.items.length){ log('Trang ' + p + ' không có text (PDF scan và OCR thất bại).', 'err'); continue; }
      processPage(p, res.items, res.width, res.height, res.sourceType);
      setProgress(Math.round(p/pdfDoc.numPages*100));
    }
  } else {
    if(!imageFile){ log('Chưa có ảnh.', 'err'); return; }
    setProgress(10);
    log('Đang trích xuất ảnh...');
    const res = await extractImageItems(imageFile);
    if(!res.items.length){ log('Ảnh không có text (OCR thất bại).', 'err'); return; }
    processPage(1, res.items, res.width, res.height, res.sourceType);
    setProgress(100);
  }
  setProgress(100);
  log('Phân tích xong.', 'ok');
  showInfo();
  showPreview();
}

$('btnAnalyze').addEventListener('click', analyze);
$('btnPreviewData').addEventListener('click', previewData);
$('btnPreviewWord').addEventListener('click', previewWord);
$('btnPreviewExcel').addEventListener('click', previewExcel);

function showInfo(){
  const totalRows = pagesData.reduce((a,p)=>a+p.rows,0);
  const maxCols = Math.max(0, ...pagesData.map(p=>p.cols));
  $('info').innerHTML = pagesData.map(p=>`<span class="pill">Trang ${p.pageNum}: ${p.rows} dòng × ${p.cols} cột (${p.sourceType})</span>`).join('') +
    `<div style="margin-top:8px;color:var(--muted)">Tổng: ${pagesData.length} trang, ${totalRows} dòng, tối đa ${maxCols} cột.</div>`;
  $('infoCard').style.display='block';
}

function showPreview(){
  $('previewCard').style.display='block';
  previewData();
}

function previewData(){
  const p = pagesData[0];
  if(!p) return;
  let html = '<table>';
  const maxR = Math.min(p.grid.length, 50);
  for(let r=0;r<maxR;r++){
    html += '<tr>';
    for(let c=0;c<p.grid[r].length;c++){
      html += '<td>' + escapeHtml(String(p.grid[r][c])) + '</td>';
    }
    html += '</tr>';
  }
  html += '</table>';
  if(p.grid.length>maxR) html += '<div style="color:var(--muted)">... còn ' + (p.grid.length-maxR) + ' dòng</div>';
  $('preview').innerHTML = html;
}

function loadScript(src){
  return new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = src;
    s.onload = resolve;
    s.onerror = reject;
    document.head.appendChild(s);
  });
}

async function ensureDocxPreview(){
  if(window.docxPreview && typeof window.docxPreview.renderAsync === 'function') return;
  if(!window.JSZip){
    await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  }
  const saved = window.docx;
  await loadScript('https://cdn.jsdelivr.net/npm/docx-preview@0.4.1/dist/docx-preview.min.js');
  window.docxPreview = window.docx;
  window.docx = saved;
}

async function previewWord(){
  const preview = $('preview');
  preview.innerHTML = '<div style="color:var(--muted)">Đang tạo bản xem trước Word...</div>';
  try {
    const blob = await buildWordBlob();
    await ensureDocxPreview();
    const wrap = document.createElement('div');
    wrap.className = 'docx-wrapper';
    preview.innerHTML = '';
    preview.appendChild(wrap);
    await window.docxPreview.renderAsync(blob, wrap);
  } catch(e){
    preview.innerHTML = '<span class="err">Lỗi xem trước Word: ' + escapeHtml(e.message||e) + '</span>';
    console.error(e);
  }
}

function previewExcel(){
  const preview = $('preview');
  try {
    const wb = buildExcelWorkbook();
    const name = wb.SheetNames[0];
    const ws = wb.Sheets[name];
    const html = XLSX.utils.sheet_to_html(ws, {id:'previewSheet'});
    let out = html;
    if(wb.SheetNames.length > 1){
      out += '<div style="color:var(--muted);margin-top:8px">Đang xem sheet đầu: ' + escapeHtml(name) + ' (tổng ' + wb.SheetNames.length + ' sheet)</div>';
    }
    preview.innerHTML = out;
  } catch(e){
    preview.innerHTML = '<span class="err">Lỗi xem trước Excel: ' + escapeHtml(e.message||e) + '</span>';
    console.error(e);
  }
}

// ---- Export Excel ----
$('btnExcel').addEventListener('click', exportExcel);
function buildExcelWorkbook(){
  const wb = XLSX.utils.book_new();
  pagesData.forEach((p) => {
    const ws = XLSX.utils.aoa_to_sheet(p.grid);
    const ncols = p.grid.reduce((a,r)=>Math.max(a,r.length),0);
    ws['!cols'] = Array.from({length:ncols}, (_,c)=>{
      let max=8;
      for(const r of p.grid) if(r[c]!=null){ const l=String(r[c]).length; if(l>max) max=Math.min(l,40); }
      return {wch:max+2};
    });
    const name = 'Trang ' + p.pageNum;
    XLSX.utils.book_append_sheet(wb, ws, name.slice(0,31));
  });
  return wb;
}
function exportExcel(){
  try {
    const wb = buildExcelWorkbook();
    const out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    downloadBlob(new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'converted.xlsx');
    log('Đã xuất Excel.', 'ok');
  } catch(e){ log('Lỗi xuất Excel: ' + e.message, 'err'); }
}

// ---- Export Word ----
$('btnWord').addEventListener('click', exportWord);
async function buildWordBlob(){
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType, HeadingLevel, PageBreak } = docx;
  const children = [];
  pagesData.forEach((p, idx) => {
    if(idx>0) children.push(new Paragraph({children:[new PageBreak()]}));
    children.push(new Paragraph({ text: 'Trang ' + p.pageNum, heading: HeadingLevel.HEADING_2 }));
    const ncols = p.grid.reduce((a,r)=>Math.max(a,r.length),0);
    const nonEmptyRows = p.grid.filter(r=>r.some(c=>String(c).trim()!==''));
    const avgCols = nonEmptyRows.reduce((a,r)=>a + r.filter(c=>String(c).trim()!=='').length,0)/Math.max(nonEmptyRows.length,1);
    const isTable = ncols >= 2 && nonEmptyRows.length>=2 && avgCols >= 1.5;
    if(isTable){
      const rows = nonEmptyRows.map(r => new TableRow({
        children: Array.from({length:ncols}, (_,c) => new TableCell({
          children: [ new Paragraph({ children:[ new TextRun({ text: String(r[c]??'') }) ] }) ],
          width: { size: Math.floor(9000/ncols), type: WidthType.DXA }
        }))
      }));
      children.push(new Table({ rows, width:{size:9000, type:WidthType.DXA} }));
    } else {
      for(const r of p.grid){
        const line = r.map(c=>String(c)).join(' ').trim();
        if(line) children.push(new Paragraph({ children:[ new TextRun(line) ] }));
      }
    }
  });
  const documentObj = new Document({ sections:[{ children }] });
  return await Packer.toBlob(documentObj);
}
async function exportWord(){
  try {
    const blob = await buildWordBlob();
    downloadBlob(blob, 'converted.docx');
    log('Đã xuất Word.', 'ok');
  } catch(e){ log('Lỗi xuất Word: ' + e.message, 'err'); console.error(e); }
}

// ---- Export JSON ----
$('btnJson').addEventListener('click', exportJson);
function exportJson(){
  try {
    const data = { generatedAt: new Date().toISOString(), pages: pagesData };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    downloadBlob(blob, 'converted.json');
    log('Đã xuất JSON.', 'ok');
  } catch(e){ log('Lỗi xuất JSON: ' + e.message, 'err'); }
}

function downloadBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
}
</script>
